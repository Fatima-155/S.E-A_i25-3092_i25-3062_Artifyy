<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Artify & Co.</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Global Theme Styles (Move to assets/css/style.css later) --- */
        :root {
            --primary-pastel: #ffb7b2; /* Soft Salmon */
            --secondary-pastel: #b5ead7; /* Mint */
            --accent-pastel: #c7ceea; /* Lavender */
            --bg-color: #fff9f9; /* Pinkish White */
            --text-dark: #4a4a4a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-pastel) !important;
            font-size: 1.5rem;
        }
        .nav-link {
            color: var(--text-dark);
            font-weight: 500;
        }

        /* Buttons & Inputs */
        .btn-pastel {
            background-color: var(--primary-pastel);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-pastel:hover {
            background-color: #ff9e99;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 183, 178, 0.4);
            color: white;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 12px;
            background-color: #fafafa;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(255, 183, 178, 0.2);
            border-color: var(--primary-pastel);
        }

        /* --- Login Specific Styles --- */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #fff0f0 0%, transparent 40%),
                        radial-gradient(circle at bottom left, #f0fff9 0%, transparent 40%);
            padding: 2rem;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            background: white;
        }

        .login-header {
            background: var(--primary-pastel);
            padding: 30px;
            text-align: center;
            color: white;
            border-radius: 0 0 50% 50% / 20px;
            margin-bottom: 20px;
        }

        .social-login-btn {
            border: 1px solid #eee;
            border-radius: 50px;
            background: white;
            color: #555;
            transition: 0.2s;
        }
        .social-login-btn:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- Simple Navigation to get back Home -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">
                <i class="fa-solid fa-pen-nib me-2"></i>Artify
            </a>
            <a href="home.html" class="btn btn-sm btn-outline-secondary rounded-pill">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Shop
            </a>
        </div>
    </nav>

    <!-- Main Login Section -->
    <div class="login-wrapper mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    
                    <div class="card login-card animate__animated animate__fadeInUp">
                        <!-- Decorative Header -->
                        <div class="login-header">
                            <i class="fa-regular fa-user-circle fa-3x mb-2"></i>
                            <h4 class="mb-0 fw-bold">Welcome Back</h4>
                        </div>

                        <div class="card-body p-4 pt-2">
                            <form id="loginForm" novalidate>
                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="email" class="form-label small text-muted fw-bold ms-1">EMAIL ADDRESS</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 border rounded-start-3 text-muted">
                                            <i class="fa-regular fa-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="name@example.com" required>
                                        <div class="invalid-feedback">
                                            Please enter a valid email address.
                                        </div>
                                    </div>
                                </div>

                                <!-- Password Field -->
                                <div class="mb-4">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label for="password" class="form-label small text-muted fw-bold ms-1">PASSWORD</label>
                                        <a href="#" class="small text-decoration-none" style="color: var(--primary-pastel)">Forgot?</a>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 border rounded-start-3 text-muted">
                                            <i class="fa-solid fa-lock"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
                                        <div class="invalid-feedback">
                                            Password is required.
                                        </div>
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-pastel w-100 shadow-sm mb-3">
                                    Log In
                                </button>

                                <!-- Divider -->
                                <div class="text-center position-relative my-4">
                                    <hr class="text-muted opacity-25">
                                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted small">OR</span>
                                </div>

                                <!-- Social Login -->
                                <div class="d-flex gap-2 mb-4">
                                    <button type="button" class="btn social-login-btn w-50 py-2">
                                        <i class="fa-brands fa-google text-danger me-2"></i> Google
                                    </button>
                                    <button type="button" class="btn social-login-btn w-50 py-2">
                                        <i class="fa-brands fa-facebook text-primary me-2"></i> Facebook
                                    </button>
                                </div>

                                <!-- Sign Up Link -->
                                <div class="text-center">
                                    <p class="small text-muted mb-0">Don't have an account?</p>
                                    <a href="#" class="fw-bold text-decoration-none" style="color: var(--primary-pastel)">Kill urself bro</a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Login Specific JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                event.stopPropagation();

                // Bootstrap Form Validation Check
                if (!loginForm.checkValidity()) {
                    loginForm.classList.add('was-validated');
                    return;
                }

                // If valid, simulate login
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Simple feedback (In a real app, you'd fetch an API here)
                const btn = loginForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

                setTimeout(() => {
                    // Check specific credentials
                    if (email === "rida@isb.nu.edu.pk" && password === "Greninja") {
                        console.log(`Login success: ${email}`);
                        alert("Login Successful! Redirecting to shop...");
                        
                        // Redirect to home page
                        window.location.href = 'home.html';
                    } else {
                        alert("Invalid credentials! Please use the correct email and password.");
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
