<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sellers - Artify & Co.</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Global Theme --- */
        :root {
            --primary-pastel: #ffb7b2; /* Peach */
            --secondary-pastel: #b5ead7; /* Mint */
            --accent-pastel: #c7ceea; /* Lavender */
            --bg-color: #fff9f9;
            --text-dark: #4a4a4a;
            --gold: #ffd700;
            --soft-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-top: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Navbar (Consistent) --- */
        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 15px 0;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-pastel) !important;
            font-size: 1.5rem;
        }
        .nav-link {
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s;
            padding: 0 15px !important;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary-pastel);
        }
        .badge-cart {
            background-color: var(--primary-pastel);
            color: white;
        }
        .nav-pfp {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border: 2px solid var(--primary-pastel);
            padding: 2px;
            transition: transform 0.2s;
        }
        .nav-pfp:hover { transform: scale(1.1); }

        /* --- Header Section --- */
        .page-header {
            text-align: center;
            padding: 3rem 0;
        }
        .page-title {
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
        }
        .page-title::after {
            content: '';
            display: block;
            width: 80%;
            height: 5px;
            background: linear-gradient(to right, var(--primary-pastel), var(--accent-pastel));
            margin: 5px auto 0;
            border-radius: 10px;
        }

        /* --- Product Cards --- */
        .product-card {
            background: white;
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: var(--soft-shadow);
            transition: all 0.3s ease;
            height: 100%;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 15px 35px rgba(255, 183, 178, 0.2);
        }
        
        /* Image Container */
        .card-img-wrapper {
            position: relative;
            height: 240px;
            background-color: #fcfcfc;
            overflow: hidden;
        }
        .card-img-top {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .product-card:hover .card-img-top {
            transform: scale(1.08);
        }

        /* Ranking Badge */
        .rank-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background-color: white;
            color: var(--text-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 2;
            border: 2px solid var(--primary-pastel);
        }
        .rank-1 { background: var(--gold); border-color: #e6c200; color: white; }
        .rank-2 { background: #C0C0C0; border-color: #a9a9a9; color: white; }
        .rank-3 { background: #cd7f32; border-color: #b87333; color: white; }

        /* Card Body */
        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .product-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .product-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .product-desc {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .price-tag {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-pastel);
        }

        /* Buttons */
        .btn-add {
            background-color: var(--primary-pastel);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-add:hover {
            background-color: #ff9e99;
            transform: translateY(-2px);
            color: white;
        }

        /* Footer */
        footer {
            background-color: white;
            margin-top: auto;
            padding: 40px 0;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar fixed-top">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="navbar-brand" href="home.html">
                <i class="fa-solid fa-pen-nib me-2"></i>Artify
            </a>

            <!-- Links Centered -->
            <ul class="nav mx-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link px-2" href="home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link px-2" href="categories.html">Categories</a></li>
                <li class="nav-item"><a class="nav-link active px-2" href="topsellers.html">Top Sellers</a></li>
            </ul>
            
            <!-- Right Side -->
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link position-relative me-2" href="cart.html">
                    <i class="fa-solid fa-cart-shopping fs-5"></i>
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill badge-cart">
                        0
                    </span>
                </a>
                <a href="#" class="text-decoration-none">
                    <img src="assets/img/pfp.jpeg" alt="Profile" class="rounded-circle nav-pfp shadow-sm" onerror="this.src='https://placehold.co/50x50/ffb7b2/white?text=Me'">
                </a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="page-header animate__animated animate__fadeInDown">
        <div class="container">
            <h1 class="page-title">Top Sellers</h1>
            <p class="text-muted mt-2">Most popular stationery items loved by students & offices.</p>
        </div>
    </section>

    <!-- Top Sellers Grid -->
    <div class="container mb-5">
        <div class="row g-4" id="sellers-grid">
            <!-- JS will populate this -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <h4 class="fw-bold" style="color: var(--primary-pastel)">Artify</h4>
            <p class="text-muted mb-4">Making your desk the happiest place on earth.</p>
            <div class="mb-4">
                <a href="#" class="mx-2 text-secondary"><i class="fa-brands fa-instagram fa-lg"></i></a>
                <a href="#" class="mx-2 text-secondary"><i class="fa-brands fa-pinterest fa-lg"></i></a>
                <a href="#" class="mx-2 text-secondary"><i class="fa-brands fa-twitter fa-lg"></i></a>
            </div>
            <small class="text-muted">Made with love by Fast Islamabad</small>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="cartToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Item added to cart!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- Top Sellers Data ---
        // Images will be automatically assigned as s1.jpeg, s2.jpeg, etc. based on index
        const topSellers = [
            { name: "Premium Gel Pen Set", cat: "Pens", desc: "Smooth flowing ink, pack of 12 vibrant colors.", price: 450 },
            { name: "A5 Hardcover Journal", cat: "Notebooks", desc: "180gsm paper, perfect for bullet journaling.", price: 850 },
            { name: "Pastel Highlighters", cat: "Markers", desc: "Soft colors that won't bleed through paper.", price: 320 },
            { name: "Desk Organizer Mesh", cat: "Desk", desc: "Keep your workspace tidy and aesthetic.", price: 1200 },
            { name: "Correction Tape Pack", cat: "Office", desc: "Instant drying, clean correction tape.", price: 150 },
            { name: "Mechanical Pencil 0.5", cat: "Pens", desc: "Precise writing for math and drafting.", price: 220 },
            { name: "Cute Washi Tapes", cat: "Craft", desc: "Set of 5 decorative tapes for scrapbooking.", price: 280 },
            { name: "Sticky Note Set", cat: "Office", desc: "Various sizes and pastel colors.", price: 180 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSellers();
            updateCartCount();
        });

        function renderSellers() {
            const grid = document.getElementById('sellers-grid');
            grid.innerHTML = '';

            topSellers.forEach((item, index) => {
                const rank = index + 1;
                const imgPath = `assets/img/s${rank}.jpeg`;
                
                // Determine rank class for styling styling medals
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const html = `
                <div class="col-12 col-md-6 col-lg-3 animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.1}s">
                    <div class="product-card">
                        <div class="rank-badge ${rankClass}">#${rank}</div>
                        <div class="card-img-wrapper">
                            <img src="${imgPath}" class="card-img-top" alt="${item.name}" 
                                 onerror="this.src='https://placehold.co/300x300/f8f8f8/4a4a4a?text=Top+Seller+${rank}'">
                        </div>
                        <div class="card-body">
                            <span class="product-category">${item.cat}</span>
                            <h5 class="product-title text-truncate">${item.name}</h5>
                            <p class="product-desc text-truncate">${item.desc}</p>
                            
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="price-tag">Rs. ${item.price}</span>
                                <button class="btn btn-add shadow-sm" onclick="addToCart(${rank + 100}, '${item.name.replace(/'/g, "\\'")}', ${item.price}, '${imgPath}')">
                                    <i class="fa-solid fa-cart-plus me-1"></i> Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                grid.innerHTML += html;
            });
        }

        // --- Cart Logic (Shared) ---
        let cart = JSON.parse(localStorage.getItem('stationeryCart')) || [];

        function addToCart(id, name, price, img) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ id, name, price, img, qty: 1 });
            }
            localStorage.setItem('stationeryCart', JSON.stringify(cart));
            updateCartCount();
            
            const toastEl = document.getElementById('cartToast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function updateCartCount() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (badge) badge.innerText = count;
        }
    </script>
</body>
</html>
